name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# 同一分支的并发运行只保留最新一次,节省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web · 类型检查 / 测试 / 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装依赖
        # strict-dep-builds=false: esbuild/sharp/workerd 的 build 脚本未批准时仅警告不致命。
        # 这些依赖在 CI(Linux)用预编译产物即可,无需本地编译,vite build 已验证可正常工作。
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      - name: 类型检查
        run: pnpm exec tsc --noEmit

      - name: 测试
        run: pnpm test

      - name: 构建
        run: pnpm build

  research:
    name: Research · 课题产物质量门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 校验所有课题产物 (JSON-LD / 引用分级 / 自包含)
        run: |
          fail=0
          for f in research/topics/*/index.html; do
            echo "▸ 校验 $f"
            python3 .claude/skills/research-artifact-html/scripts/validate_artifact.py "$f" || fail=1
          done
          exit $fail
